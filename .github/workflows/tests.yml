name: Run Tests

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run Tests
    runs-on: [ self-hosted, iOS ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Mise
        uses: jdx/mise-action@v2
        with:
          cache: false
          experimental: true

      - name: PDM installs dependencies
        run: pdm install

      - name: Run tests
        run: pdm run pytest
