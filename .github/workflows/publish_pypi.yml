name: Publish PyPI

on:
  release:
    types: [ published ]

jobs:
  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0
      - name: Publish package distributions to PyPI
        run: pdm publish
