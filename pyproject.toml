[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "import_loco"
description = "Easily check and import the l8n strings from Loco into your projects."
license = "Apache-2.0"
dynamic = ["version"]
requires-python = ">=3.7"
dependencies = [
    "requests==2.32.4"
]