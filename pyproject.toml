[project]
name = "import_loco"
description = "Easily check and import the l8n strings from Loco into your projects"
authors = [
    {name = "Valentin Perignon", email = "valentin.perignon@infomaniak.com"},
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "Apache License 2.0"}
dynamic = ["version"]
dependencies = ["requests>=2.32.5"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.scripts]
import_loco = "python -m import_loco"

[tool.ruff]
exclude = ["src/loco_validator"]
line-length = 130

[tool.ruff.lint]
ignore = ["F403", "F405"]

[dependency-groups]
lint = [
    "ruff>=0.14.13",
]
test = [
    "pytest>=8.4.2",
]
